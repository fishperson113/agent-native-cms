# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: agent-native-cms
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Render pre-deploy commands require a paid web service. Drizzle migrations
    # are idempotent, so the free service applies them before each process start.
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CMS_MCP_SESSION_IDLE_TIMEOUT_MS
        value: 1800000
      - key: CMS_MCP_MAX_SESSIONS
        value: 100
      - key: CMS_MCP_ALLOWED_ORIGINS
        value: "*"
      - key: CMS_ADMIN_ALLOWED_ORIGINS
        value: https://agent-native-cms.onrender.com
